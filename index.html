<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Il Blu Welcome Guide</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}
#book{
    width:350px;
    height:600px;
}
.page{
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}
iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div id="book">

<div class="page">
Cover
</div>

<div class="page">
<iframe src="https://drive.google.com/file/d/1wvUaTM4pLgZnfZk8HIuU7KpwbMD4z5--/view?usp=drive_link"></iframe>
</div>

</div>

<script>

const pageFlip = new St.PageFlip(
document.getElementById("book"),
{
width:350,
height:600
}
);

pageFlip.loadFromHTML(
document.querySelectorAll(".page")
);

</script>

</body>
</html>
