<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<title>Il Blu Welcome Guide</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#book{
    width:100vw,
    height:100vh,
}

.page{
    background:white;
}

.page img{
    width:100%;
    height:100%;
    object-fit:contain;
}
</style>
</head>

<body>

<div id="book">

<div class="page"><img src="CoverV2_Page_01.jpg"></div>
<div class="page"><img src="CoverV2_Page_02.jpg"></div>
<div class="page"><img src="CoverV2_Page_03.jpg"></div>
<div class="page"><img src="CoverV2_Page_04.jpg"></div>
<div class="page"><img src="CoverV2_Page_05.jpg"></div>
<div class="page"><img src="CoverV2_Page_06.jpg"></div>
<div class="page"><img src="CoverV2_Page_07.jpg"></div>
<div class="page"><img src="CoverV2_Page_08.jpg"></div>
<div class="page"><img src="CoverV2_Page_09.jpg"></div>
<div class="page"><img src="CoverV2_Page_10.jpg"></div>
<div class="page"><img src="CoverV2_Page_11.jpg"></div>
<div class="page"><img src="CoverV2_Page_12.jpg"></div>

</div>

<script>

const pageFlip = new St.PageFlip(
    document.getElementById("book"),
    {
        width:800,
        height:1200,

        size:"stretch",

        minWidth:315,
        maxWidth:2000,

        minHeight:420,
        maxHeight:3000,

        showCover:true,

        mobileScrollSupport:false,

        useMouseEvents:true,

        swipeDistance:30,

        flippingTime:500,

        maxShadowOpacity:0.3
    }
);

pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
);

</script>

</body>
</html>
